url: https://diogro.github.io/rgraphtool/

# Shared site layout (same in stanimal, indri, grnland, evomod2): build with
# `Rscript pkgdown/build_site.R`; the look is in pkgdown/extra.scss and only
# the accent colour below is per package. The home page is the README.
template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  bslib:
    primary: "#7a4e8c"

home:
  title: "rgraphtool: graph-tool's stochastic block models, natively in R"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]

articles:
- title: Stochastic block models
  navbar: Stochastic block models
  contents:
  - blockmodels-and-hierarchy
  - posterior-sampling
  - model-class-selection
  - weighted-and-layered-sbms
  - assortative-and-ordered-sbms
- title: Network reconstruction
  navbar: Network reconstruction
  contents:
  - network-reconstruction
- title: Visualization, scaling & C++ extensions
  navbar: Visualization, scaling & C++
  contents:
  - visualization-and-animation
  - scaling-and-cpp-extensions

reference:
- title: Graphs and data
  contents:
  - graph_create
  - read_gt
  - football_network
  - netzschleuder_network
- title: Block models
